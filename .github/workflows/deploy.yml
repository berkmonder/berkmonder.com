# Every push to main: build the site's image, start it and check it answers (as the server will), then
# publish it to GitHub's registry (ghcr.io/berkmonder/berkmonder). The VPS copies each new version into
# its own registry, runs it within ~4 minutes and goes back to the previous image if it doesn't get
# healthy there (nix-dotfiles: hosts/vps/apps.nix).
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write # publish the image (with this run's own token; nothing stored)
concurrency:
  group: deploy
env:
  IMAGE: ghcr.io/berkmonder/berkmonder
jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          podman build -t "$IMAGE:latest" -t "$IMAGE:${{ github.sha }}" \
            --label org.opencontainers.image.revision=${{ github.sha }} \
            --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
      - name: Start it and check it answers
        run: |
          podman run -d --name smoke "$IMAGE:latest"
          for _ in $(seq 30); do
            podman exec smoke wget -q --spider http://127.0.0.1:80/ && exit 0
            sleep 2
          done
          podman logs smoke
          exit 1
      - name: Publish
        run: |
          podman login ghcr.io -u "${{ github.actor }}" --password-stdin <<<"${{ secrets.GITHUB_TOKEN }}"
          podman push "$IMAGE:${{ github.sha }}"
          podman push "$IMAGE:latest"
